*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;min-height:100vh;color:#2b3653;background:radial-gradient(circle at 0 0,#fff0bb,transparent 28%),radial-gradient(circle at 100% 90%,#c9fae1,transparent 30%),#eaf5ff}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:4px solid orange;outline-offset:3px}a{color:#6959c7;text-decoration:none;font-weight:800}.wrap{max-width:890px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:1000;font-size:25px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#fff;border-radius:30px;padding:10px 16px;font-weight:900;box-shadow:0 5px 15px #889ac222}.hero{text-align:center;padding:25px 10px 15px}.hero h1{font-size:clamp(29px,6vw,49px);margin:7px}.hero p{color:#62708b}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 23px}.nav button{background:#fff;border-radius:16px;padding:11px 18px;font-weight:900;color:#66718c}.nav button.active{background:#7160de;color:white}.panel{background:#fff;padding:clamp(20px,5vw,36px);border-radius:30px;box-shadow:0 15px 44px #657baa25;min-height:330px}.big{text-align:center;font-size:70px;line-height:1.3}.panel h2{text-align:center;font-size:clamp(22px,4vw,30px);margin:9px 0 15px}.panel p{font-size:18px;line-height:1.6;text-align:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px auto;max-width:730px}.choice{padding:18px 13px;background:#eff2ff;border-radius:18px;font-weight:800;color:#303b5d;min-height:70px}.choice:hover{background:#dfe5ff}.primary{background:#705cda;color:#fff;padding:15px 22px;border-radius:17px;font-weight:900;min-height:50px}.secondary{background:#edf0ff;color:#594abb;padding:14px 21px;border-radius:17px;font-weight:900}.center{text-align:center}.feedback{background:#e8fbee;padding:18px;border-radius:20px;text-align:center;margin:15px 0;font-size:19px;font-weight:700}.feedback.try{background:#fff0da}.progress{height:13px;background:#ecedfc;border-radius:20px;overflow:hidden;margin:10px 0 20px}.progress div{height:100%;background:#5ccca6;transition:width .3s}.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.item{background:#f5f6ff;padding:20px;border-radius:22px;text-align:center}.item .emoji{font-size:50px}.item h3{margin:10px 0 4px}.item button{padding:11px 15px;background:#725fda;color:#fff;border-radius:14px;font-weight:800;margin-top:10px}.item button:disabled{opacity:.45;cursor:default}.notice{color:#61708a;font-size:15px!important}footer{text-align:center;padding:24px;color:#78829b;font-size:13px}@media(max-width:550px){.answers{grid-template-columns:1fr}.brand{font-size:21px}.panel p{font-size:16px}}

body{background:linear-gradient(180deg,#8cdbff 0,#d5f4ff 38%,#ecfff0 72%,#fff8e7 100%);background-attachment:fixed}
.wrap{max-width:1020px}.top{padding:15px 18px;border-radius:0 0 25px 25px;background:#ffffffc7;backdrop-filter:blur(12px);position:relative;z-index:2}

.mission-place{background:#e7f3ff;border-radius:25px;padding:9px 15px;font-weight:900;color:#386b9a}.mission-steps{font-weight:800;color:#6857ac}.mission-complete{display:inline-block;margin:0 12px 14px;color:#167e58;font-weight:850}.panel .mission-place{display:inline-block}.nav{gap:7px}.nav button{padding:11px 14px}.speed-label{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:#4e5790;background:#fff;padding:8px 12px;border-radius:14px}.speed-label select{border:1px solid #abb7d9;border-radius:9px;padding:7px;background:#fafaff;color:#303b64;font:inherit}.city-heading{text-align:center}.city-scene{position:relative;padding:35px 15px 0;background:linear-gradient(#96e4ff,#dcfaff 62%,#86d894 63%);border-radius:26px;overflow:hidden}.city-sun{position:absolute;top:5px;right:12%;font-size:46px}.city-cloud{position:absolute;left:11%;top:5px;font-size:38px}.city-houses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative;z-index:1}.city-house{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center;background:#fff7e2;border:4px solid #dfb381;border-bottom:10px solid #ab7b59;border-radius:26px 26px 15px 15px;min-height:175px;color:#634c4a;box-shadow:0 10px 0 #4c9a7d75;transition:transform .2s}.city-house:hover{transform:translateY(-7px)}.city-emoji{font-size:55px}.city-house strong{font-size:19px}.city-house small{font-size:12px;color:#836d62}.city-road{font-size:31px;background:#d9d5bc;text-align:center;margin:30px -15px 0;padding:13px;letter-spacing:8px}@media(max-width:640px){.city-houses{grid-template-columns:repeat(2,minmax(0,1fr))}.city-house{min-height:145px}.city-emoji{font-size:40px}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="../../">🏝️ Остров умных монет</a><div class="stats"><span class="pill">🪙 <span id="coins">0</span></span><span class="pill">⭐ <span id="stars">0</span></span></div></header><div class="hero"><h1>Твоё денежное приключение!</h1><p>Выбирай с умом, копи на мечту и делай добрые дела ✨</p><div class="world" id="world" aria-label="Карта волшебных островов"><div class="island"><div class="land">🌳</div><span class="name">Лес выбора</span></div><div class="island"><div class="land">🛠️</div><span class="name">Трудоград</span></div><div class="island"><div class="land">🐷</div><span class="name">Бухта мечты</span></div><div class="island"><div class="land">🛍️</div><span class="name">Рынок</span></div><div class="island"><div class="land">💚</div><span class="name">Остров добра</span></div></div></div><div class="audio-tools"><button id="soundToggle" onclick="toggleSound()" aria-pressed="false">🔇 Звук выключен</button><button id="readButton" onclick="readCurrent()">🔊 Прочитать задание</button><label class="speed-label">Скорость <select id="voiceSpeed" onchange="setVoiceRate(this.value)"><option value="1.2">1,2×</option><option value="1.4" selected>1,4×</option><option value="1.6">1,6×</option><option value="1.8">1,8×</option></select></label></div><nav class="nav"><button id="tabAdventure" class="active" onclick="show('adventure')">🗺️ Приключения</button><button id="tabCity" onclick="show('city')">🏘️ Город</button><button id="tabMissions" onclick="show('missions')">🎭 Миссии</button><button id="tabShop" onclick="show(&quot;shop&quot;)">🛍️ Магазин</button><button id="tabDream" onclick="show(&quot;dream&quot;)">🐷 Копилка</button><button id="tabHelp" onclick="show('help')">💚 Добро</button></nav><main class="panel" id="view" aria-live="polite"></main><footer>Игра для детей 5–6 лет · Без рекламы и настоящих платежей · <a href="../../">Все игры</a></footer></div><script>
const QUESTS=[
["🍎","Ты проголодался. Что сначала купить?","Яблоко для перекуса","Третью игрушку",0,"Еда помогает нам быть здоровыми. Игрушки тоже радуют, но сначала важные потребности."],
["🧹","Как люди обычно получают деньги?","Деньги сами растут на дереве","Люди работают и приносят пользу",1,"Мы получаем деньги за полезный труд и услуги."],
["🧸","Ты хочешь большую игрушку, но монет пока мало.","Понемногу откладывать","Обидеться и требовать купить",0,"К большой мечте можно идти маленькими шагами."],
["🏷️","Два одинаковых карандаша стоят 4 и 7 монет. Какой выбрать?","За 7 монет","За 4 монеты",1,"Сравнивать цены — полезная привычка."],
["🎁","У тебя есть монеты на подарок другу. Что важно?","Выбрать что-то приятное и по силам","Потратить всё, даже на ненужное",0,"Хороший подарок — не обязательно дорогой."],
["🌧️","Вдруг сломался зонтик. Для чего нужна копилка?","Чтобы всегда тратить всё сразу","Чтобы были деньги на важные неожиданности",1,"Запас помогает справляться с сюрпризами."],
["🎨","Ты нарисовал красивые открытки. Как помочь людям и получить монетки?","Предложить свою полезную работу","Забрать деньги без спроса",0,"Ценность создаётся, когда ты делаешь что-то полезное другим."],
["🍦","Тебе захотелось мороженое, но ты копишь на велосипед.","Подумать, что сейчас важнее","Всегда покупать всё сразу",0,"Только ты решаешь, что важнее. Иногда можно порадовать себя, а иногда — подождать."],
["🤝","Друг потерял игрушку и грустит. Что сделать?","Посмеяться над ним","Поддержать и помочь поискать",1,"Доброта важнее любых монет."],
["💰","У тебя появилось 10 монет. Как лучше поступить?","Подумать: сколько потратить, отложить и подарить","Не задумываясь потратить всё",0,"Деньги можно распределять между разными целями."],
["🌳","Что полезнее для природы?","Чинить хорошие вещи, если возможно","Выбрасывать всё при первой царапине",0,"Бережливость помогает не только кошельку, но и природе."],
["🎯","Как накопить на мечту?","Ждать, что всё появится само","Поставить цель и регулярно откладывать",1,"Терпение и план помогают достигать мечты."]
];
const KEY='kids-smart-coins-v1';const blank={coins:0,stars:0,step:0,savings:0,kind:0,items:[],log:[],missionsDone:[],jobsDone:0};let state;try{state={...blank,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...blank}}let tab='adventure',feedback='',answered=false,missionIndex=0,missionChoice=null;let soundEnabled=false,ctx=null,lastStory='';let voiceRate=1.4;const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function tone(success=true){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx=ctx||new C();if(ctx.state==='suspended')ctx.resume();[0,1,2].forEach((n)=>{let o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+n*.11;o.type='sine';o.frequency.value=(success?[523,659,784]:[330,294,262])[n];g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.075,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+.15);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+.17)})}catch(e){}}
function speak(t){if(!soundEnabled||!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=voiceRate;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}}
function setVoiceRate(v){voiceRate=Number(v)||1.4;try{speechSynthesis.cancel()}catch(e){}if(soundEnabled)speak('Теперь я говорю быстрее!')}
function toggleSound(){soundEnabled=!soundEnabled;try{speechSynthesis.cancel()}catch(e){}updateAudio();if(soundEnabled){tone();speak('Привет! Я Лисёнок Копеечка. Нажми прочитать задание, и я помогу тебе.')} }
function updateAudio(){const b=document.getElementById('soundToggle');b.textContent=soundEnabled?'🔊 Звук включён':'🔇 Звук выключен';b.setAttribute('aria-pressed',String(soundEnabled));const rd=document.getElementById('readButton');rd.textContent=canSpeak?'🔊 Прочитать задание':'🔈 Чтение недоступно';rd.disabled=!canSpeak}
function readCurrent(){if(!canSpeak)return;if(!soundEnabled){soundEnabled=true;updateAudio()}let t='';if(tab==='adventure'){const q=QUESTS[state.step];t=q?(answered?(feedback==='try'?'Попробуй ещё раз!':q[5]):q[1]+'. Первый вариант: '+q[2]+'. Второй вариант: '+q[3]):'Ура! Ты прошёл все приключения!'}else if(tab==='city'){t='Добро пожаловать в город умных монет. Выбирай: дом, мастерская, магазин или копилка.'}else if(tab==='missions'){const m=MISSIONS[missionIndex];t=missionChoice===null?m.story+'. '+m.question+'. Первый вариант: '+m.choices[0].label+'. Второй вариант: '+m.choices[1].label:m.choices[missionChoice].result}else if(tab==='shop'){t='Это магазин. Подумай, что хочешь купить.'}else if(tab==='dream'){t='Это копилка. Здесь можно откладывать монеты.'}else{t='Это остров добрых дел. Можно помочь друзьям.'}speak(t)}
function celebration(label){lastStory='<div class="story-toast" role="status"><span class="celebrate">🎉✨🎈</span>'+label+'</div>'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}update()}
function update(){document.getElementById('coins').textContent=state.coins;document.getElementById('stars').textContent=state.stars;document.querySelectorAll('.island').forEach((el,i)=>el.classList.toggle('current',Math.min(4,Math.floor(state.step/3))===i))}
function show(next){try{speechSynthesis.cancel()}catch(e){}tab=next;feedback='';answered=false;missionChoice=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById(({adventure:'tabAdventure',city:'tabCity',missions:'tabMissions',shop:'tabShop',dream:'tabDream',help:'tabHelp'})[tab]).classList.add('active');render()}
function render(){update();updateAudio();const v=document.getElementById('view');if(tab==='adventure'){if(state.step>=QUESTS.length){v.innerHTML='<div class="big">🏆🎉</div><h2>Ты прошёл все приключения!</h2><p>Отличная работа! Ты научился заботиться о деньгах и людях. Можно пройти вопросы ещё раз и заработать новые звёзды.</p><div class="center"><button class="primary" onclick="replay()">Повторить приключение</button></div>';return}const q=QUESTS[state.step];v.innerHTML='<div class="guide"><span class="character">🦊</span><span>Привет! Я Лисёнок Копеечка. Нажми «Прочитать задание», если нужна помощь!</span></div>'+lastStory+'<div class="center">Задание '+(state.step+1)+' из '+QUESTS.length+'</div><div class="progress"><div style="width:'+(state.step/QUESTS.length*100)+'%"></div></div><div class="big">'+q[0]+'</div><h2>'+q[1]+'</h2>'+(answered?'<div class="feedback '+(feedback==='try'?'try':'')+'">'+(feedback==='try'?'Подумаем ещё! 🌱':q[5])+'</div><div class="center"><button class="primary" onclick="next()">Дальше →</button></div>':'<div class="answers"><button class="choice" onclick="answer(0)">'+q[2]+'</button><button class="choice" onclick="answer(1)">'+q[3]+'</button></div><p class="notice">За ответ получишь ⭐ звезду и 5 🪙 монет. Ошибаться можно!</p>');return}
if(tab==='city'){renderCity(v);return}if(tab==='missions'){renderMission(v);return}if(tab==='shop'){const items=[['✏️','Цветные карандаши',15],['🧩','Пазл',25],['🛴','Самокат',55],['📚','Книжка',20]];v.innerHTML='<div class="big">🛍️</div><h2>Магазин разумных покупок</h2><p>Подумай, чего ты действительно хочешь. У тебя '+state.coins+' монет.</p><div class="shop">'+items.map((it,i)=>'<div class="item"><div class="emoji">'+it[0]+'</div><h3>'+it[1]+'</h3><div>🪙 '+it[2]+'</div><button '+(state.coins<it[2]?'disabled':'')+' onclick="buy('+i+')">Купить</button></div>').join('')+'</div><p class="notice">'+(feedback||'Покупки здесь игровые — ничего настоящего оплачивать не нужно.')+'</p>';return}
if(tab==='dream'){v.innerHTML='<div class="big">🐷🚲</div><h2>Мечта: велосипед</h2><p>Чтобы накопить на велосипед, собери 50 монет в копилке.</p><div class="progress"><div style="width:'+Math.min(100,state.savings*2)+'%"></div></div><p>Накоплено '+state.savings+' из 50 монет</p><div class="center"><button class="primary" '+(state.coins<5?'disabled':'')+' onclick="deposit()">Отложить 5 🪙</button></div><p class="notice">'+(state.savings>=50?'🎉 Ты достиг цели! Терпение помогло тебе накопить на мечту.':feedback||'В копилке монеты не пропадают — они ждут твою цель.')+'</p>';return}
v.innerHTML='<div class="big">💚🤝</div><h2>Остров добрых дел</h2><p>Можешь поделиться 5 монетами, чтобы купить семена для общего сада.</p><div class="center"><button class="primary" '+(state.coins<5?'disabled':'')+' onclick="give()">Подарить 5 🪙</button></div><p>🌱 Добрых дел: '+state.kind+'</p><p class="notice">'+(feedback||'Помогать другим можно не только деньгами, но и временем, вниманием и заботой.')+'</p>'}


const CITY_PLACES=[['🏠','Дом','Забота и отдых'],['🛠️','Мастерская','Полезный труд'],['🏪','Магазин','Обдуманные покупки'],['🐷','Копилка','Большая мечта']];
let cityPlace=null,jobStage=0;
function renderCity(v){if(cityPlace===null){v.innerHTML='<div class="city-heading"><h2>🏘️ Город умных монет</h2><p>Куда отправимся сегодня? Выбирай домик!</p></div><div class="city-scene"><div class="city-sun">☀️</div><div class="city-cloud">☁️</div><div class="city-houses">'+CITY_PLACES.map((p,i)=>'<button class="city-house" onclick="enterCity('+i+')"><span class="city-emoji">'+p[0]+'</span><strong>'+p[1]+'</strong><small>'+p[2]+'</small></button>').join('')+'</div><div class="city-road">🚶 🌳 🌼 🌳</div></div><p class="notice">Можешь возвращаться в любой домик в любое время.</p>';return}
const back='<div class="center"><button class="secondary" onclick="cityPlace=null;render()">← На карту города</button></div>';
if(cityPlace===0){v.innerHTML='<div class="big">🏠🧸</div><h2>Наш уютный дом</h2><p>Лисёнок напоминает: отдых, помощь близким и игры с друзьями тоже очень ценны. Не всё хорошее покупается за монеты!</p><div class="center"><button class="primary" onclick="homeKind()">Помочь убрать игрушки 💚</button></div><p id="homeMessage" class="notice"></p>'+back;return}
if(cityPlace===1){v.innerHTML='<div class="big">🛠️🎨</div><h2>Мастерская полезных дел</h2><p>Помоги Лисёнку подготовить открытки для ярмарки. Сначала выбери, что ему понадобится.</p><div class="answers"><button class="choice" onclick="doJob(0)">🎨 Бумага и карандаши</button><button class="choice" onclick="doJob(1)">🎈 Только воздушные шарики</button></div><p class="notice" id="jobMessage">За полезное дело можно получить 5 игровых монет. Всего одно задание за посещение мастерской.</p>'+back;return}
if(cityPlace===2){v.innerHTML='<div class="big">🏪</div><h2>Магазин на площади</h2><p>Здесь можно сравнить желания и возможности. Купить игрушку — тоже нормальный выбор, когда ты подумал о бюджете.</p><div class="center"><button class="primary" onclick="show(&quot;shop&quot;)">Выбрать покупку →</button></div>'+back;return}
v.innerHTML='<div class="big">🐷🚲</div><h2>Домик копилки</h2><p>Маленькие накопления приближают большую мечту. Ты уже накопил '+state.savings+' монет!</p><div class="center"><button class="primary" onclick="show(&quot;dream&quot;)">Открыть копилку →</button></div>'+back}
function enterCity(i){cityPlace=i;jobStage=0;render();if(soundEnabled){speak(CITY_PLACES[i][1]+'. '+CITY_PLACES[i][2])}}
function homeKind(){document.getElementById('homeMessage').textContent='💚 Спасибо! Забота о доме важна сама по себе, даже без денежной награды.';tone();speak('Отлично! Помогать дома — это тоже доброе дело.')}
function doJob(i){const el=document.getElementById('jobMessage');if(jobStage)return;if(i===1){el.textContent='Шарики красивые, но для открыток нужны бумага и карандаши. Попробуй ещё!';speak('Подумай, чем рисуют открытки.');return}jobStage=1;state.jobsDone=(state.jobsDone||0)+1;state.coins+=5;save();tone();el.textContent='🎉 Открытки готовы! Ты заработал 5 монет полезным делом.';speak('Ты помог сделать открытки и заработал пять монет!');}

const MISSIONS=[
{emoji:'🐰🥕',name:'Помоги зайчику',place:'Огород добрых дел',story:'Зайчик выращивает морковку. У него есть 10 монет и желание купить красивую шляпу. Но для будущего урожая ему нужны семена за 6 монет.',question:'Как ему поступить?',choices:[{label:'🌱 Купить семена за 6',result:'Зайчик посадил семена и вырастит новую морковку. Он выбрал то, что нужно для полезного дела!',good:true},{label:'🎩 Купить шляпу за 10',result:'Шляпа красивая, но на семена денег не осталось. В следующий раз стоит подумать о важном заранее.',good:false}]},
{emoji:'🐻🍯',name:'Медведь и ярмарка',place:'Ярмарочная площадь',story:'Медведь продаёт баночки мёда. Один покупатель предложил 8 монет, другой — 5 монет за такую же баночку. Медведь хочет честно назначить одну понятную цену для всех.',question:'Что ему поможет?',choices:[{label:'🏷️ Поставить одну справедливую цену',result:'Покупатели видят понятную цену. Честная торговля помогает доверять друг другу.',good:true},{label:'🙈 Каждому называть случайную цену',result:'Покупатели запутались и расстроились. Честные правила удобнее для всех.',good:false}]},
{emoji:'🦊🎈',name:'Праздник Лисёнка',place:'Поляна праздников',story:'У Лисёнка есть 12 монет. На праздник нужны угощения за 7 монет. Он ещё хочет воздушный шар за 8 монет, но всё вместе купить не получится.',question:'Что выбрать сначала?',choices:[{label:'🍎 Угощения для гостей',result:'Гости довольны, и ещё осталось 5 монет. Шарик можно купить в другой раз!',good:true},{label:'🎈 Только большой шарик',result:'Шарик яркий, но друзьям нечего предложить. Полезно учитывать и других.',good:false}]},
{emoji:'🐢🌧️',name:'Черепашка и дождь',place:'Дождливый берег',story:'Черепашка накопила 15 монет. Начался дождь, и старый зонтик сломался. Новый стоит 9 монет.',question:'Что делать с накоплениями?',choices:[{label:'☂️ Купить нужный зонтик',result:'Хорошо, что был запас! Теперь Черепашка может гулять, а 6 монет останутся.',good:true},{label:'💎 Потратить всё на блестяшки',result:'Блестяшки красивые, но от дождя не спасут. Запас нужен для важных случаев.',good:false}]}
];
function renderMission(v){
const m=MISSIONS[missionIndex],done=state.missionsDone||[],completed=done.includes(missionIndex);
v.innerHTML='<div class="center mission-steps">🎭 История '+(missionIndex+1)+' из '+MISSIONS.length+' · Пройдено '+done.length+'</div><div class="big">'+m.emoji+'</div><h2>'+m.name+'</h2><div class="center"><span class="mission-place">📍 '+m.place+'</span></div><p>'+m.story+'</p><h2>'+m.question+'</h2>'+
(missionChoice===null?
'<div class="answers">'+m.choices.map((c,i)=>'<button class="choice" onclick="chooseMission('+i+')">'+c.label+'</button>').join('')+'</div>':
'<div class="feedback '+(m.choices[missionChoice].good?'':'try')+'">'+m.choices[missionChoice].result+'</div>'+
'<div class="center">'+(completed?'<span class="mission-complete">⭐ История пройдена</span>':'')+'<button class="primary" onclick="nextMission()">Следующая история →</button></div>')+
'<p class="notice">За первое завершение каждой истории: 5 🪙 и ⭐. Здесь можно пробовать разные решения, не теряя монеты.</p>';
}
function chooseMission(i){if(missionChoice!==null)return;missionChoice=i;const m=MISSIONS[missionIndex];if(!state.missionsDone)state.missionsDone=[];if(!state.missionsDone.includes(missionIndex)){state.missionsDone.push(missionIndex);state.coins+=5;state.stars+=1;save();tone(true)}speak(m.choices[i].result);render()}
function nextMission(){missionIndex=(missionIndex+1)%MISSIONS.length;missionChoice=null;render();if(soundEnabled)readCurrent()}
function answer(i){if(answered)return;lastStory='';const q=QUESTS[state.step];answered=true;if(i===q[4]){state.coins+=5;state.stars++;feedback='ok';tone(true);speak('Молодец! '+q[5])}else{feedback='try';tone(false);speak('Ничего страшного! Попробуй другой вариант.')}save();render()}
function next(){if(!answered)return;if(feedback==='try'){answered=false;feedback='';render();return}state.step++;if(state.step%3===0){celebration('Новый остров покорён! Ты прекрасно справляешься!');tone(true);speak('Ура! Новый остров открыт!')}else{lastStory=''}save();answered=false;feedback='';render()}
function replay(){state.step=0;lastStory='';save();render()}
function buy(i){const it=[['✏️','Цветные карандаши',15],['🧩','Пазл',25],['🛴','Самокат',55],['📚','Книжка',20]][i];if(state.coins<it[2])return;state.coins-=it[2];state.items.push(it[1]);feedback='🎉 Куплено: '+it[1]+'. Ты сам сделал выбор!';tone();speak('Отлично! Покупка совершена!');save();render()}
function deposit(){if(state.coins<5)return;state.coins-=5;state.savings+=5;tone();speak(state.savings>=50?'Ура! Ты накопил на велосипед!':'Молодец! Ты отложил пять монет.');save();render()}
function give(){if(state.coins<5)return;state.coins-=5;state.kind++;feedback='Спасибо! Ты помог вырастить сад 🌱';tone();speak('Спасибо за твою доброту!');save();render()}
show('adventure');
</script></body></html>
